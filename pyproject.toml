[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigtrade"
version = "0.2.0"
description = "Causal, rolling-window path-signature features for financial time series"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Filip Nowakowicz" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.3",
    "roughpy>=0.3",
]

[project.optional-dependencies]
iisignature = ["iisignature>=0.24"]
test = ["pytest>=7", "hypothesis>=6", "pandas>=2", "pyarrow>=14"]
# Not part of the library: what `benchmarks/orvp` needs to run.
benchmark = ["pandas>=2", "pyarrow>=14", "kaggle>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]
