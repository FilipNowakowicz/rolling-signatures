[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rollsig"
version = "0.3.1"
description = "Causal, rolling-window path-signature features for financial time series"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Filip Nowakowicz" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.3",
    "roughpy>=0.3",
]

[project.optional-dependencies]
iisignature = ["iisignature>=0.24"]
test = ["pytest>=7", "hypothesis>=6", "pandas>=2", "pyarrow>=14", "ruff>=0.12"]
# Not part of the library: what `benchmarks/orvp` needs to run.
benchmark = ["pandas>=2", "pyarrow>=14", "kaggle>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F"]

# iisignature 0.24 imports NumPy from setup.py without declaring it as a build
# dependency. Tell uv what its isolated build environment needs.
[tool.uv.extra-build-dependencies]
iisignature = ["numpy"]
