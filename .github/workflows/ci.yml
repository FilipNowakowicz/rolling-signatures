name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install sigtrade with test extras
        run: pip install -e ".[test]"

      - name: Install iisignature
        # iisignature's setup.py needs numpy at build time but doesn't
        # declare it as a build requirement, so it must already be present
        # outside pip's isolated build env (docs/notes.html s1.9). Building
        # without isolation also means setuptools must be in the outer
        # environment explicitly -- it isn't bundled by default here.
        run: |
          pip install setuptools numpy
          pip install --no-build-isolation iisignature

      - name: Run tests
        run: pytest -q
