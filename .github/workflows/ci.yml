name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.11.28"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra test --extra iisignature

      - name: Lint
        run: uv run --locked --extra test --extra iisignature ruff check .

      - name: Run tests
        run: uv run --locked --extra test --extra iisignature pytest -q
